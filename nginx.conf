server {
    listen 80;
    server_name erkconsult.com www.erkconsult.com;
    return 301 https://www.erkconsult.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name erkconsult.com;

    ssl_certificate     /etc/letsencrypt/live/www.erkconsult.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.erkconsult.com/privkey.pem;

    return 301 https://www.erkconsult.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.erkconsult.com;

    ssl_certificate     /etc/letsencrypt/live/www.erkconsult.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.erkconsult.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /var/erk;
    index index.html;

    charset utf-8;

    # Security headers
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        text/html
        text/css
        text/xml
        text/plain
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Cache static assets
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }

    # Crawl budget: block common probe paths
    location ~* /(wp-admin|wp-login|wp-content|xmlrpc|\.env|\.git|cgi-bin) {
        return 404;
    }

    # Custom 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Clean URLs: /privacy → /privacy.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Deny dotfiles (except .well-known for ACME)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # robots.txt & sitemap: no log noise
    location = /robots.txt  { access_log off; log_not_found off; }
    location = /sitemap.xml { access_log off; log_not_found off; }
}
