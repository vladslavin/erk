# ============================================================
# erkconsult.com — HTTP → HTTPS redirect
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name erkconsult.com www.erkconsult.com;
    return 301 https://erkconsult.com$request_uri;
}

# ============================================================
# erkconsult.com — HTTPS
# ============================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name erkconsult.com www.erkconsult.com;

    ssl_certificate     /etc/letsencrypt/live/erkconsult.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erkconsult.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Redirect www → non-www
    if ($host = www.erkconsult.com) {
        return 301 https://erkconsult.com$request_uri;
    }

    root /var/erk;
    index index.html;
    charset utf-8;

    # ── Security headers ──
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        text/html
        text/css
        text/xml
        text/plain
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ── Cache: images ──
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Cache: fonts ──
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }

    # ── Crawl budget: block probe paths ──
    location ~* /(wp-admin|wp-login|wp-content|xmlrpc|\.env|\.git|cgi-bin) {
        return 404;
    }

    # ── Custom 404 ──
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ── Clean URLs: /privacy → /privacy.html ──
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # ── Deny dotfiles (except .well-known for ACME) ──
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── No-log crawl files ──
    location = /robots.txt  { access_log off; log_not_found off; }
    location = /sitemap.xml { access_log off; log_not_found off; }
}
